<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detection Engineering Portfolio</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f7f9;
      --text: #1d2125;
      --muted: #5f6b76;
      --border: #dde1e6;
      --accent: #2457c5;
      --selected: #e6edfb;
      --todo: #6b7682;
      --progress: #a15c00;
      --done: #1f7a3d;
      --code-bg: #eef0f3;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181c;
        --panel: #1c2026;
        --text: #e3e6ea;
        --muted: #98a2ad;
        --border: #2e343c;
        --accent: #7aa2f7;
        --selected: #243049;
        --todo: #98a2ad;
        --progress: #e0a050;
        --done: #5cc483;
        --code-bg: #232830;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
    }
    header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 340px) 1fr;
      min-height: calc(100vh - 80px);
    }

    nav {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      overflow-y: auto;
    }
    .phase { margin-bottom: 18px; }
    .phase-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 0 20px 6px;
    }
    .phase-head h2 {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .phase-count { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    .bar {
      height: 3px;
      margin: 0 20px 6px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar > span { display: block; height: 100%; background: var(--done); }

    .steps { list-style: none; margin: 0; padding: 0; }
    .steps button {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 20px;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .steps button:hover { background: var(--selected); }
    .steps button[aria-current="true"] {
      background: var(--selected);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .status {
      flex: none;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 1px 7px;
      border: 1px solid currentColor;
      border-radius: 10px;
    }
    .status.todo { color: var(--todo); }
    .status.in-progress { color: var(--progress); }
    .status.done { color: var(--done); }
    .status.unknown { color: var(--muted); border-style: dashed; }

    main { padding: 24px 32px 48px; min-width: 0; }
    .step-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .step-meta code { font-family: var(--mono); }
    .notice { color: var(--muted); }
    .error { color: #c0392b; }

    .readme { max-width: 860px; }
    .readme h1, .readme h2, .readme h3 { line-height: 1.25; }
    .readme h1 { font-size: 1.6rem; margin-top: 0; }
    .readme h2 { font-size: 1.25rem; margin-top: 1.8em; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .readme a { color: var(--accent); }
    .readme img { max-width: 100%; height: auto; }
    .readme code {
      font-family: var(--mono);
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .readme pre {
      background: var(--code-bg);
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
    }
    .readme pre code { background: none; padding: 0; }
    .readme table { border-collapse: collapse; display: block; overflow-x: auto; }
    .readme th, .readme td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .readme .mermaid { margin: 1em 0; overflow-x: auto; }
    .readme blockquote { margin: 0; padding: 0 14px; border-left: 3px solid var(--border); color: var(--muted); }

    @media (max-width: 760px) {
      header { padding: 14px 16px; }
      .layout { grid-template-columns: 1fr; }
      nav { border-right: 0; border-bottom: 1px solid var(--border); }
      .phase-head, .steps button { padding-left: 16px; padding-right: 16px; }
      .bar { margin-left: 16px; margin-right: 16px; }
      main { padding: 20px 16px 40px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Detection Engineering Portfolio</h1>
    <p id="summary">Loading roadmap...</p>
  </header>
  <div class="layout">
    <nav id="roadmap" aria-label="Roadmap"></nav>
    <main id="content">
      <p class="notice">Select a step to view its README.</p>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    const STATUSES = ["todo", "in-progress", "done"];
    const nav = document.getElementById("roadmap");
    const content = document.getElementById("content");
    const summary = document.getElementById("summary");
    const steps = new Map();

    function el(tag, attrs, text) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function statusBadge(status) {
      const known = STATUSES.includes(status);
      return el("span", { class: "status " + (known ? status : "unknown") }, status || "unset");
    }

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-cache" });
      if (!response.ok) throw new Error(response.status + " " + response.statusText);
      return response.text();
    }

    function renderRoadmap(data) {
      const phases = (data && data.phases) || [];
      let total = 0;
      let done = 0;

      for (const phase of phases) {
        const phaseSteps = phase.steps || [];
        const phaseDone = phaseSteps.filter(s => s.status === "done").length;
        total += phaseSteps.length;
        done += phaseDone;

        const section = el("section", { class: "phase" });
        const head = el("div", { class: "phase-head" });
        head.append(el("h2", {}, phase.title || phase.id), el("span", { class: "phase-count" }, phaseDone + " / " + phaseSteps.length));
        const bar = el("div", { class: "bar" });
        const fill = el("span");
        fill.style.width = phaseSteps.length ? (100 * phaseDone / phaseSteps.length) + "%" : "0";
        bar.append(fill);

        const list = el("ul", { class: "steps" });
        for (const step of phaseSteps) {
          steps.set(String(step.id), step);
          const button = el("button", { type: "button", "data-id": step.id });
          button.append(el("span", {}, step.title || step.id), statusBadge(step.status));
          button.addEventListener("click", () => { location.hash = "step=" + encodeURIComponent(step.id); });
          const item = el("li");
          item.append(button);
          list.append(item);
        }

        section.append(head, bar, list);
        nav.append(section);
      }

      summary.textContent = done + " of " + total + " steps done across " + phases.length + " phases.";
    }

    // Resolve relative image and link URLs against the step folder, so README
    // files can reference their own images with paths like images/foo.png.
    function rebaseUrls(container, baseUrl) {
      const isRelative = value => value && !/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(value);
      for (const img of container.querySelectorAll("img[src]")) {
        const src = img.getAttribute("src");
        if (isRelative(src)) img.src = new URL(src, baseUrl).href;
      }
      for (const link of container.querySelectorAll("a[href]")) {
        const href = link.getAttribute("href");
        if (isRelative(href)) link.href = new URL(href, baseUrl).href;
      }
    }

    mermaid.initialize({
      startOnLoad: false,
      theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default"
    });

    // marked leaves ```mermaid blocks as <pre><code class="language-mermaid">;
    // swap each for a .mermaid container and let Mermaid draw it.
    async function renderMermaid(container) {
      const nodes = [];
      for (const code of container.querySelectorAll("code.language-mermaid")) {
        const diagram = el("div", { class: "mermaid" }, code.textContent);
        code.closest("pre").replaceWith(diagram);
        nodes.push(diagram);
      }
      if (nodes.length) await mermaid.run({ nodes });
    }

    async function showStep(id) {
      const step = steps.get(id);
      for (const button of nav.querySelectorAll("button[data-id]")) {
        button.setAttribute("aria-current", String(button.dataset.id === id));
      }
      if (!step) {
        content.replaceChildren(el("p", { class: "notice" }, "Select a step to view its README."));
        return;
      }

      const folder = String(step.path || "").replace(/^\.?\/+|\/+$/g, "");
      const readmePath = (folder ? folder + "/" : "") + "README.md";
      const meta = el("div", { class: "step-meta" });
      meta.append(statusBadge(step.status), el("code", {}, readmePath));
      const body = el("article", { class: "readme" });
      content.replaceChildren(meta, body);

      try {
        const markdown = await fetchText(readmePath);
        body.innerHTML = marked.parse(markdown);
        rebaseUrls(body, new URL(readmePath, location.href));
      } catch (err) {
        body.replaceChildren(
          el("h1", {}, step.title || step.id),
          el("p", { class: "notice" }, "No README yet at " + readmePath + " (" + err.message + ").")
        );
        return;
      }
      try {
        await renderMermaid(body);
      } catch (err) {
        console.error("Mermaid rendering failed:", err);
      }
    }

    function currentStepId() {
      const match = location.hash.match(/^#step=(.+)$/);
      return match ? decodeURIComponent(match[1]) : null;
    }

    async function init() {
      let data;
      try {
        data = jsyaml.load(await fetchText("roadmap.yml"));
      } catch (err) {
        const hint = location.protocol === "file:" ? " Serve this folder over HTTP (see README.md)." : "";
        summary.textContent = "";
        summary.append(el("span", { class: "error" }, "Could not load roadmap.yml: " + err.message + "." + hint));
        return;
      }
      renderRoadmap(data);
      window.addEventListener("hashchange", () => showStep(currentStepId()));
      showStep(currentStepId());
    }

    init();
  </script>
</body>
</html>
